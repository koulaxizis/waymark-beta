<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="referrer" content="origin">
  <meta name="description" content="Waymark — Privacy-first OpenStreetMap editor. Explore, learn, and contribute to OSM. No cookies, no tracking, no ads.">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <meta name="theme-color" content="#6d4aff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Waymark">

  <!-- Open Graph -->
  <meta property="og:title" content="Waymark — OpenStreetMap Editor">
  <meta property="og:description" content="Privacy-first PWA for exploring, learning, and contributing to OpenStreetMap.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://koulaxizis.github.io/waymark/">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Styles -->
  <link rel="stylesheet" href="styles.css">

  <!-- Config -->
  <script src="config.js"></script>
  <!-- i18n (loaded early for language detection) -->
  <script src="i18n.js"></script>
  <!-- Theme (dark mode exclusive) -->
  <script src="theme.js"></script>
</head>
<body>
  <div id="app">
    <!-- Map -->
    <div id="map"></div>

    <!-- Top-left: Module Toggles -->
    <div id="modulePanel" class="control-panel top-left">
      <div class="panel-header">
        <h2 id="modulesTitle">Modules</h2>
        <button id="toggleModules" class="panel-collapse" aria-label="Collapse">−</button>
      </div>
      <div id="moduleToggles" class="panel-body"></div>
    </div>

    <!-- Top-right: Layer Selector -->
    <div id="layerPanel" class="control-panel top-right">
      <div class="panel-header">
        <h2 id="layersTitle">Layers</h2>
        <button id="toggleLayers" class="panel-collapse" aria-label="Collapse">−</button>
      </div>
      <div id="layerControls" class="panel-body">
        <button class="layer-btn active" data-layer="standard">🗺️ Standard</button>
        <button class="layer-btn" data-layer="satellite">🛰️ Satellite</button>
        <button class="layer-btn" data-layer="cycle">🚲 Cycle</button>
        <button class="layer-btn" data-layer="transport">🚌 Transport</button>
      </div>
    </div>

    <!-- Bottom-right: Active Module Panel -->
    <div id="activeModulePanel" class="control-panel bottom-right">
      <div class="panel-header">
        <h2 id="activeModuleTitle"></h2>
        <button id="closeModule" class="panel-close" aria-label="Close module">✕</button>
      </div>
      <div id="moduleContent" class="panel-body module-content"></div>
    </div>

    <!-- Loading overlay -->
    <div id="loadingOverlay" class="loading-overlay">
      <div class="spinner-large"></div>
      <p id="loadingText">Loading Waymark...</p>
    </div>
  </div>

  <!-- Core Scripts -->
  <script src="app.js" defer></script>

  <!-- Module Scripts -->
  <script src="modules/nominatim.js" defer></script>
  <script src="modules/poi-viewer.js" defer></script>
  <script src="modules/gpx-editor.js" defer></script>
  <script src="modules/xml-generator.js" defer></script>
  <script src="modules/quality-checker.js" defer></script>
  <script src="modules/heatmap.js" defer></script>
  <script src="modules/tags-lookup.js" defer></script>
  <script src="modules/notes-browser.js" defer></script>
  <script src="modules/tutorial.js" defer></script>
  <script src="modules/osm-editor.js" defer></script>

  <!-- New Modules -->
  <script src="modules/track-recorder.js" defer></script>
  <script src="modules/building-editor.js" defer></script>
  <script src="modules/road-editor.js" defer></script>
  <script src="modules/address-mapper.js" defer></script>
  <script src="modules/quest-mode.js" defer></script>
</body>
</html>
