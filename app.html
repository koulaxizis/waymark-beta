<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#6d4aff">
  <title>Waymark — OpenStreetMap Editor</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <div class="loading-overlay" id="loadingOverlay">
      <div class="spinner-large"></div>
      <p id="loadingText">Loading Waymark...</p>
    </div>

    <header id="appHeader">
      <a href="#" class="app-logo">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C7.6 2 4 5.6 4 10c0 5.5 8 12 8 12s8-6.5 8-12c0-4.4-3.6-8-8-8zm0 11a3 3 0 110-6 3 3 0 010 6z" fill="#6d4aff"/>
        </svg>
        Waymark
      </a>
      <div class="header-actions">
        <button id="globalLoginBtn" class="header-login-btn" title="OSM Login">🔐</button>
        <button id="langBtn" class="lang-btn">EN</button>
        <button id="themeBtn" class="theme-btn">🌙</button>
        <button id="helpBtn" class="help-btn">?</button>
      </div>
    </header>

    <div id="map"></div>
    <div class="location-button" id="locationBtn" title="My Location">📍</div>

    <div class="control-panel top-left">
      <div class="panel-header">
        <h2 id="modulesTitle">Modules</h2>
      </div>
      <div class="panel-body" id="moduleToggles"></div>
    </div>

    <div class="control-panel top-right">
      <div class="panel-header">
        <h2 id="layersTitle">Layers</h2>
      </div>
      <div class="panel-body" id="layerControls"></div>
    </div>

    <div class="control-panel bottom-right" id="activeModulePanel">
      <div class="panel-header">
        <h2 id="activeModuleTitle"></h2>
        <button class="panel-close" onclick="closeActivePanel()">✕</button>
      </div>
      <div class="panel-body module-content" id="moduleContent"></div>
    </div>

    <footer id="appFooter">
      <span>Waymark</span><span>•</span>
      <span>OpenStreetMap</span><span>•</span>
      <span>Privacy First</span>
    </footer>
  </div>

  <!-- Config & i18n (synchronous, before everything) -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="theme.js"></script>

  <!-- Utils (synchronous, before modules) -->
  <script src="modules/utils.js"></script>

  <!-- Module scripts (synchronous, must load before app.js) -->
  <script src="modules/nominatim.js"></script>
  <script src="modules/poi-viewer.js"></script>
  <script src="modules/gpx-editor.js"></script>
  <script src="modules/xml-generator.js"></script>
  <script src="modules/osm-editor.js"></script>
  <script src="modules/quality-checker.js"></script>
  <script src="modules/heatmap.js"></script>
  <script src="modules/tags-lookup.js"></script>
  <script src="modules/notes-browser.js"></script>
  <script src="modules/track-recorder.js"></script>
  <script src="modules/building-editor.js"></script>
  <script src="modules/road-editor.js"></script>
  <script src="modules/address-mapper.js"></script>
  <script src="modules/quest-mode.js"></script>

  <!-- Leaflet MUST load before app.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Main app (loads LAST, after everything is ready) -->
  <script src="app.js"></script>
</body>
</html>
