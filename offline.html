<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waymark — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 2rem;
    }
    h1 { margin-bottom: 1rem; color: #6d4aff; }
    p { opacity: 0.7; margin-bottom: 2rem; line-height: 1.5; }
    button {
      background: #6d4aff;
      color: white;
      border: none;
      padding: 1rem 2rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover { background: #7f63ff; }
  </style>
</head>
<body>
  <div>
    <h1>🌐 Είσαι Offline / You are offline</h1>
    <p>Η εφαρμογή θα δουλέψει με cached δεδομένα.<br>The app will work with cached data.</p>
    <button onclick="window.location.reload()">Ανανέωση / Reload</button>
  </div>
</body>
</html>
