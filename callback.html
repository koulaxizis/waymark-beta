<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waymark OAuth Callback</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #333;
      border-top-color: #6d4aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #message { margin-top: 1rem; color: #a0a0a0; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p id="message">Processing OAuth callback...</p>

  <script>
    // Process OAuth callback
    (async () => {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');

      if (!code || !state) {
        showError('Invalid callback parameters');
        return;
      }

      if (state !== 'waymark_editor') {
        showError('Invalid state parameter');
        return;
      }

      const cfg = await fetch('config.js').then(r => r.text()).then(t => {
        // Extract config from JS file
        const match = t.match(/window\.WAYMARK_CONFIG\s*=\s*\{([^}]+)\}/s);
        if (!match) return null;
        // Very rough parse - would need proper eval in production
        return null;
      });

      // Use a simpler approach: fetch from known config endpoint
      // In production, you'd have a separate config API
      const configUrl = 'https://koulaxizis.github.io/waymark-beta/config.js';

      try {
        const response = await fetch(configUrl);
        const text = await response.text();

        // Parse CLIENT_ID and REDIRECT_URI from the file
        const clientIdMatch = text.match(/OSM_CLIENT_ID:\s*'([^']+)'/);
        const redirectUriMatch = text.match(/REDIRECT_URI:\s*'([^']+)'/);
        const proxyMatch = text.match(/PROXY_URL:\s*'([^']+)'/);

        if (!clientIdMatch || !redirectUriMatch || !proxyMatch) {
          throw new Error('Could not parse config');
        }

        const clientId = clientIdMatch[1];
        const redirectUri = decodeURIComponent(redirectUriMatch[1]);
        const proxyUrl = proxyMatch[1];

        // Exchange code for token
        const tokenResponse = await fetch(proxyUrl + '/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            grant_type: 'authorization_code',
            code: code,
            redirect_uri: redirectUri,
            client_id: clientId,
            code_verifier: sessionStorage.getItem('pkce_verifier') || ''
          })
        });

        const tokenData = await tokenResponse.json();

        if (tokenData.access_token) {
          // Store token in sessionStorage
          sessionStorage.setItem('osm_access_token', tokenData.access_token);

          // Get user info
          const userInfoResponse = await fetch(proxyUrl + '/api/0.6/user/details', {
            headers: { Authorization: `Bearer ${tokenData.access_token}` }
          });

          const userInfo = await userInfoResponse.json();
          const userId = userInfo.osm?.user?.id;
          if (userId) {
            sessionStorage.setItem('osm_user_id', userId.toString());
          }

          // Success - redirect to app
          window.location.href = 'app.html';
        } else {
          showError('Token exchange failed');
        }
      } catch (err) {
        console.error(err);
        showError('Error: ' + err.message);
      }
    })();

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      document.getElementById('message').textContent = 'Error: ' + msg;
      document.getElementById('message').style.color = '#ef4444';
    }
  </script>
</body>
</html>
