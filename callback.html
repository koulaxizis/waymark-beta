<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Waymark — OAuth Callback</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .spinner {
      width: 40px; height: 40px;
      border: 3px solid #333;
      border-top-color: #6d4aff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    p { margin-top: 1rem; opacity: 0.7; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error { color: #ff6b6b; }
  </style>
  <!-- THIS WAS MISSING — config.js must load before the script runs -->
  <script src="config.js"></script>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner" id="spinner"></div>
    <p id="message">Completing login...</p>
  </div>

  <script>
    const CONFIG = window.WAYMARK_CONFIG || { PROXY_URL: '' };

    async function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');

      const msgEl = document.getElementById('message');
      const spinnerEl = document.getElementById('spinner');

      if (error) {
        spinnerEl.style.display = 'none';
        msgEl.textContent = 'OAuth error: ' + error;
        msgEl.classList.add('error');
        setTimeout(() => window.location.href = 'app.html', 3000);
        return;
      }

      if (!code) {
        spinnerEl.style.display = 'none';
        msgEl.textContent = 'No authorization code received.';
        msgEl.classList.add('error');
        setTimeout(() => window.location.href = 'app.html', 3000);
        return;
      }

      const codeVerifier = sessionStorage.getItem('pkce_code_verifier');
      if (!codeVerifier) {
        spinnerEl.style.display = 'none';
        msgEl.textContent = 'Missing PKCE verifier. Please try logging in again.';
        msgEl.classList.add('error');
        setTimeout(() => window.location.href = 'app.html', 3000);
        return;
      }

      try {
        const tokenResponse = await fetch(CONFIG.PROXY_URL + '/oauth2/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            client_id: CONFIG.OSM_CLIENT_ID,
            code: code,
            redirect_uri: CONFIG.REDIRECT_URI,
            grant_type: 'authorization_code',
            code_verifier: codeVerifier,
          }),
        });

        if (!tokenResponse.ok) {
          const errText = await tokenResponse.text();
          throw new Error('Token exchange failed: ' + errText);
        }

        const tokenData = await tokenResponse.json();
        const accessToken = tokenData.access_token;

        if (accessToken) {
          sessionStorage.setItem('osm_access_token', accessToken);
          sessionStorage.removeItem('pkce_code_verifier');
          msgEl.textContent = 'Login successful! Redirecting...';
          window.location.href = 'app.html';
        } else {
          throw new Error('No access_token in response');
        }
      } catch (err) {
        spinnerEl.style.display = 'none';
        msgEl.textContent = 'Error: ' + err.message;
        msgEl.classList.add('error');
        console.error(err);
      }
    }

    handleCallback();
  </script>
</body>
</html>
